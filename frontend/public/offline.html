<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3730a3" />
    <title>iTalk — Hors ligne</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #faf9f7;
        color: #1e1b2e;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .container {
        max-width: 420px;
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem;
        background: linear-gradient(135deg, #3730a3, #6d28d9);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
      }
      h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
      p { font-size: 0.875rem; color: #6b6b80; line-height: 1.6; margin-bottom: 1.5rem; }
      .retry-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #3730a3;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 10px;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .retry-btn:hover { background: #312e81; }
      @media (prefers-color-scheme: dark) {
        body { background: #16161e; color: #e8e8f0; }
        p { color: #9b9bb0; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">✦</div>
      <h1>Vous êtes hors ligne</h1>
      <p>
        iTalk n'est pas disponible sans connexion pour le moment.
        Vérifiez votre connexion internet puis réessayez.
        Vos sessions précédentes restent accessibles une fois l'application chargée.
      </p>
      <button class="retry-btn" onclick="window.location.reload()">
        Réessayer
      </button>
    </div>
  </body>
</html>
